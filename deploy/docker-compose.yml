# 生产环境编排(宝塔适配 + 本地构建产物直推版)
#
# 架构: 本地 Windows 执行 deploy/deploy-fast.ps1 → npm run build → 打包 standalone
#       产物 → scp 到 /opt/aichatt-dist → 容器挂载运行。VPS 上不再构建镜像,
#       热修从 12-15 分钟降到 3-5 分钟, 构建期也不占 VPS 资源。
#
# 与宝塔的关系:
#   - 80/443 由宝塔 nginx 占用, 宝塔站点反代到 127.0.0.1:3001 (SSL 在宝塔管理)
#   - app 只绑回环, 不暴露公网
#
# 运行时镜像版本规则: node:<本地构建机 Node 大版本>-slim。
#   当前本地 Node v24 → node:24-slim。升级本地 Node 后需同步改这里并重新推送。
#
# 全量构建路线(镜像内构建)仍保留在 Dockerfile + deploy.sh, 仅在重大架构变更时使用;
# 日常更新一律走 deploy-fast.ps1。回滚: docker-compose.yml.bak-build + aichatt-app:latest。

services:
  postgres:
    image: postgres:16-alpine
    container_name: aichatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aichatt}
    volumes:
      - aichatt_pgdata:/var/lib/postgresql/data
      # init.sql 在项目根 scripts/, 相对 deploy/ 是 ../scripts/;
      # 注意: 挂载不存在的路径 docker 会自动建目录(曾因此拿到目录而非文件)
      - ../scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-aichatt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 全新数据卷首次 initdb + 建扩展在 2 核机器上要 1-2 分钟,
      # 不给宽限会被误判 unhealthy 导致依赖启动失败
      start_period: 90s
    networks:
      - internal

  app:
    image: node:24-slim
    container_name: aichatt-app
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aichatt}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?必须设置 AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?必须设置 AUTH_URL,例如 https://chat.yuban.icu}
      NODE_ENV: production
      # standalone server.js 监听地址/端口(容器内 3000, 映射宿主机 3001)
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      # 只绑回环: 宝塔 nginx 反代到 127.0.0.1:3001; 3000 被宿主机其他服务占用故用 3001
      - "127.0.0.1:3001:3000"
    volumes:
      # 本地构建产物目录(只读挂载, 由 deploy-fast.ps1 原子切换);
      # 目录不存在时 docker 会创建空目录导致白屏, 首次部署必须先初始化
      - /opt/aichatt-dist:/app:ro
      # 用户上传目录: 代码写 process.cwd()/public/uploads(见 src/lib/uploads.ts),
      # 卷必须精确挂这个路径(旧版误挂 /app/uploads, 数据实际落在容器层)
      - aichatt_uploads:/app/public/uploads
    networks:
      - internal

volumes:
  aichatt_pgdata:
    name: aichatt_pgdata
  aichatt_uploads:
    name: aichatt_uploads

networks:
  internal:
    name: aichatt_internal
