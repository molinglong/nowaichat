# 初始 HTTP 配置:只用于通过 certbot 申请证书
# deploy.sh 第一次跑完后会替换为 app.conf (HTTPS 版)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # certbot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余先打 503,等证书就绪 + app 起来
    location / {
        return 503 "aichatt is starting, please retry shortly";
    }
}
