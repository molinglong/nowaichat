<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aichatt (Desktop Placeholder)</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0c0c0d; color: #f5f5f7; }
      }
      header {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(127,127,127,0.2);
        font-size: 12px;
        color: rgba(127,127,127,0.8);
        user-select: none;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        max-width: 480px;
        text-align: center;
      }
      h1 { margin: 0 0 16px; font-size: 28px; font-weight: 500; }
      p { line-height: 1.6; opacity: 0.8; }
      code {
        background: rgba(127,127,127,0.15);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 13px;
        font-family: 'Geist Mono', monospace;
      }
    </style>
  </head>
  <body>
    <header>placeholder · 红绿灯在原生窗口层</header>
    <main>
      <div class="card">
        <h1>桌面客户端占位页</h1>
        <p>
          这是 <code>tauri build</code> 的临时前端产物。
          真实桌面构建需要先把 Next.js 改为静态导出，
          并把 <code>src/app/chat/c/[id]/page.tsx</code> 从 Server Component 改为 Client Component。
        </p>
        <p>
          开发模式 (<code>npm run tauri:dev</code>) 直接复用 Next dev server，
          上面提到的改造都不需要，可以正常体验。
        </p>
        <p>详见 <code>src-tauri/README.md</code>。</p>
      </div>
    </main>
  </body>
</html>
