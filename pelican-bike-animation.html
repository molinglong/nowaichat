<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root { --sky:#bfe8f3; --ink:#173044; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:#f5ecd9; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .scene { width:min(100vw,1100px); aspect-ratio:16/10; overflow:hidden; background:var(--sky); box-shadow:0 24px 70px rgba(28,55,67,.2); }
    svg { display:block; width:100%; height:100%; }
    .wheel,.pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.45s linear infinite; }
    .pedal { animation-duration:.68s; }
    .pelican { transform-box:fill-box; transform-origin:center bottom; animation:ride 1.45s ease-in-out infinite; }
    .wing { transform-box:fill-box; transform-origin:55% 72%; animation:wing .72s ease-in-out infinite alternate; }
    .leg.front,.leg.back { transform-box:fill-box; transform-origin:20% 0; animation:leg-front .68s ease-in-out infinite alternate; }
    .leg.back { animation-name:leg-back; }
    .cloud { animation:drift 22s linear infinite; }
    .cloud.slow { animation-duration:32s; animation-delay:-11s; }
    .road-dash { animation:road 1.3s linear infinite; }
    .bird { animation:bob 2.8s ease-in-out infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes ride { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(-5px) rotate(1deg); } }
    @keyframes wing { from { transform:rotate(-3deg); } to { transform:rotate(10deg); } }
    @keyframes leg-front { from { transform:rotate(28deg); } to { transform:rotate(-28deg); } }
    @keyframes leg-back { from { transform:rotate(-28deg); } to { transform:rotate(28deg); } }
    @keyframes drift { from { transform:translateX(-180px); } to { transform:translateX(1120px); } }
    @keyframes road { from { transform:translateX(0); } to { transform:translateX(-160px); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
