services:
  postgres:
    image: postgres:16-alpine
    container_name: aichatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: aichatt
    ports:
      - "5432:5432"
    volumes:
      - aichatt_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aichatt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aichatt_pgdata:
    name: aichatt_pgdata